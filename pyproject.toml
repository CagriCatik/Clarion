[tool.poetry]
name = "clarion"
version = "0.1.0"
description = "Deterministic bio-scientific documentation generator"
authors = ["Antigravity <antigravity@google.com>"]
packages = [
    { include = "clarion", from = "backend" }
]

[tool.poetry.dependencies]
python = ">=3.11"
fastapi = ">=0.110.0"
uvicorn = ">=0.29.0"
typer = ">=0.9.0"
pydantic = ">=2.7.0"
httpx = ">=0.27.0"
python-multipart = ">=0.0.9"
jinja2 = ">=3.1.0"
psutil = ">=5.9.0"
nvidia-ml-py = ">=12.535.133"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"

[tool.poetry.scripts]
clarion = "clarion.cli:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
